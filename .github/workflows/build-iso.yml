name: Compilar ISOs de Dzulux Linux V2 (Ubuntu/Debian)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-server-iso:
    name: Compilar Dzulux Server (Modo CLI)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso sudo mtools grub-pc-bin grub-efi-amd64-bin grub2-common

      - name: Inyectar Herramientas Dzulux al Servidor
        run: |
          echo "Normalizando saltos de línea (LF) en scripts y hooks..."
          find dzulux-tools dzulux-server-build -type f -exec sed -i 's/\r$//' {} +
          echo "Copiando herramientas maestras al entorno del servidor..."
          mkdir -p dzulux-server-build/config/includes.chroot/usr/local/bin
          cp -r dzulux-tools/* dzulux-server-build/config/includes.chroot/usr/local/bin/
          chmod +x dzulux-server-build/config/includes.chroot/usr/local/bin/*
          chmod +x dzulux-server-build/config/hooks/normal/*.chroot || true
          
          echo "Eliminando herramientas gráficas (Gaming/Apps) de la versión Servidor..."
          rm -f dzulux-server-build/config/includes.chroot/usr/local/bin/dzulux-gaming
          rm -f dzulux-server-build/config/includes.chroot/usr/local/bin/dzulux-apps
          rm -f dzulux-server-build/config/includes.chroot/usr/local/bin/dzulux-looks

      - name: Compilar Dzulux Server ISO (live-build)
        run: |
          set -o pipefail
          cd dzulux-server-build
          chmod +x auto/*
          sudo lb clean
          if ! sudo lb config 2>&1 | tee config.log; then
            echo "--- CONFIG FAILED. LOG OUTPUT: ---"
            cat config.log
            exit 1
          fi
          if ! sudo lb build 2>&1 | tee build.log; then
            echo "--- BUILD FAILED. LOG OUTPUT: ---"
            cat build.log
            exit 1
          fi
          echo "Generando ISO híbrida con grub-mkrescue para máxima compatibilidad con Rufus..."
          sudo mkdir -p binary/boot/grub
          if [ ! -f binary/boot/grub/grub.cfg ]; then
            VMLINUZ=$(cd binary && ls live/vmlinuz* 2>/dev/null | head -n1)
            INITRD=$(cd binary && ls live/initrd* 2>/dev/null | head -n1)
            cat <<EOF_GRUB | sudo tee binary/boot/grub/grub.cfg >/dev/null
set default=0
set timeout=5
menuentry "Dzulux Linux 2.0 Server (Live CLI)" {
    linux /${VMLINUZ:-live/vmlinuz} boot=live components quiet splash nomodeset system_mode=cli
    initrd /${INITRD:-live/initrd.img}
}
menuentry "Dzulux Linux 2.0 Server (Modo Seguro / Fallback)" {
    linux /${VMLINUZ:-live/vmlinuz} boot=live components nomodeset system_mode=cli
    initrd /${INITRD:-live/initrd.img}
}
EOF_GRUB
          fi
          if sudo grub-mkrescue -o dzulux-server-hybrid.iso binary/ -- -volid "DZULUX_SERVER"; then
            sudo rm -f live-image-amd64.iso live-image-amd64.hybrid.iso
          else
            echo "grub-mkrescue falló, renombrando ISO original..."
            for iso in *.iso; do [ -f "$iso" ] && sudo mv "$iso" dzulux-server-hybrid.iso && break; done
          fi

      - name: Guardar ISO Generada y Logs
        uses: actions/upload-artifact@v4
        with:
          name: dzulux-server-artifacts
          path: |
            dzulux-server-build/*.iso
            dzulux-server-build/build.log
          retention-days: 7

  build-desktop-iso:
    name: Compilar Dzulux Desktop (Modo GUI)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso sudo mtools grub-pc-bin grub-efi-amd64-bin grub2-common

      - name: Inyectar Herramientas Dzulux al Desktop
        run: |
          echo "Normalizando saltos de línea (LF) en scripts y hooks..."
          find dzulux-tools dzulux-desktop-build -type f -exec sed -i 's/\r$//' {} +
          mkdir -p dzulux-desktop-build/config/includes.chroot/usr/local/bin
          cp dzulux-tools/* dzulux-desktop-build/config/includes.chroot/usr/local/bin/
          chmod +x dzulux-desktop-build/config/includes.chroot/usr/local/bin/*
          chmod +x dzulux-desktop-build/config/hooks/normal/*.chroot || true

      - name: Compilar Dzulux Desktop ISO (live-build)
        run: |
          set -o pipefail
          cd dzulux-desktop-build
          chmod +x auto/*
          sudo lb clean
          if ! sudo lb config 2>&1 | tee config.log; then
            echo "--- CONFIG FAILED. LOG OUTPUT: ---"
            cat config.log
            exit 1
          fi
          if ! sudo lb build 2>&1 | tee build.log; then
            echo "--- BUILD FAILED. LOG OUTPUT: ---"
            cat build.log
            exit 1
          fi
          echo "Generando ISO híbrida con grub-mkrescue para máxima compatibilidad con Rufus..."
          sudo mkdir -p binary/boot/grub
          if [ ! -f binary/boot/grub/grub.cfg ]; then
            VMLINUZ=$(cd binary && ls live/vmlinuz* 2>/dev/null | head -n1)
            INITRD=$(cd binary && ls live/initrd* 2>/dev/null | head -n1)
            cat <<EOF_GRUB | sudo tee binary/boot/grub/grub.cfg >/dev/null
set default=0
set timeout=5
menuentry "Dzulux Linux 2.0 Desktop (Live XFCE GUI)" {
    linux /${VMLINUZ:-live/vmlinuz} boot=live components quiet splash nomodeset
    initrd /${INITRD:-live/initrd.img}
}
menuentry "Dzulux Linux 2.0 Desktop (Modo Terminal / CLI)" {
    linux /${VMLINUZ:-live/vmlinuz} boot=live components quiet splash nomodeset system_mode=cli
    initrd /${INITRD:-live/initrd.img}
}
EOF_GRUB
          fi
          if sudo grub-mkrescue -o dzulux-desktop-hybrid.iso binary/ -- -volid "DZULUX_DESKTOP"; then
            sudo rm -f live-image-amd64.iso live-image-amd64.hybrid.iso
          else
            echo "grub-mkrescue falló, renombrando ISO original..."
            for iso in *.iso; do [ -f "$iso" ] && sudo mv "$iso" dzulux-desktop-hybrid.iso && break; done
          fi

      - name: Guardar ISO Generada y Logs
        uses: actions/upload-artifact@v4
        with:
          name: dzulux-desktop-artifacts
          path: |
            dzulux-desktop-build/*.iso
            dzulux-desktop-build/build.log
          retention-days: 7

  publish-release:
    name: Publicar ISOs en GitHub Releases
    needs: [build-server-iso, build-desktop-iso]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos (Server)
        uses: actions/download-artifact@v4
        with:
          name: dzulux-server-artifacts
          path: server-iso
      - name: Descargar artefactos (Desktop)
        uses: actions/download-artifact@v4
        with:
          name: dzulux-desktop-artifacts
          path: desktop-iso
      - name: Crear/Actualizar Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dzulux Linux (Auto-Build)"
          body: "Última compilación automática de Dzulux Linux Server y Desktop."
          files: |
            server-iso/*.iso
            desktop-iso/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
