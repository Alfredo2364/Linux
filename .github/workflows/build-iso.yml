name: Compilar ISOs de Dzulux Linux V2 (Ubuntu/Debian)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  schedule:
    # Recompilación semanal automática todos los lunes a las 06:00 UTC con los últimos parches de seguridad de Ubuntu LTS
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-server-iso:
    name: Compilar Dzulux Server (Modo CLI)
    runs-on: ubuntu-24.04

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso sudo mtools grub-pc-bin grub-efi-amd64-bin grub2-common
          sudo sed -i 's/live-config-upstart/live-config-systemd/g' /usr/lib/live/build/* /usr/share/live/build/functions/* 2>/dev/null || true
          sudo sed -i 's/LB_INITSYSTEM:-upstart/LB_INITSYSTEM:-systemd/g' /usr/share/live/build/functions/* 2>/dev/null || true

      - name: Inyectar Herramientas Dzulux al Servidor
        run: |
          echo "Normalizando saltos de línea (LF) en scripts y hooks..."
          find dzulux-tools dzulux-server-build scripts -type f -exec sed -i 's/\r$//' {} +
          echo "Copiando herramientas maestras al entorno del servidor..."
          mkdir -p dzulux-server-build/config/includes.chroot/usr/local/bin
          mkdir -p dzulux-server-build/config/includes.chroot/etc/modprobe.d
          cp -r dzulux-tools/* dzulux-server-build/config/includes.chroot/usr/local/bin/
          cp -f arch-legacy/airootfs/etc/modprobe.d/apple-mac.conf dzulux-server-build/config/includes.chroot/etc/modprobe.d/ 2>/dev/null || true
          chmod +x dzulux-server-build/config/includes.chroot/usr/local/bin/*
          chmod +x dzulux-server-build/config/hooks/normal/*.chroot || true
          
          echo "Eliminando herramientas gráficas (Gaming/Apps) de la versión Servidor..."
          rm -f dzulux-server-build/config/includes.chroot/usr/local/bin/dzulux-gaming
          rm -f dzulux-server-build/config/includes.chroot/usr/local/bin/dzulux-apps
          rm -f dzulux-server-build/config/includes.chroot/usr/local/bin/dzulux-looks

      - name: Compilar Dzulux Server ISO (live-build)
        run: |
          set -o pipefail
          cd dzulux-server-build
          chmod +x auto/*
          sudo lb clean
          if ! sudo lb config 2>&1 | tee config.log; then
            echo "--- CONFIG FAILED. LOG OUTPUT: ---"
            cat config.log
            exit 1
          fi
          sudo lb build 2>&1 | tee build.log || true
          if [ -d binary/casper ]; then
            sudo mkdir -p binary/live
            sudo mv binary/casper/* binary/live/ 2>/dev/null || true
          fi
          if [ ! -f binary/live/filesystem.squashfs ]; then
            echo "--- BUILD FAILED (No se generó filesystem.squashfs). LAST 120 LINES OF LOG OUTPUT: ---"
            tail -n 120 build.log
            exit 1
          fi
          echo "Generando ISO híbrida con grub-mkrescue para máxima compatibilidad con Rufus y Máquinas Virtuales..."
          sudo mkdir -p binary/boot/grub
          VMLINUZ=$(cd binary && ls live/vmlinuz* 2>/dev/null | head -n1)
          INITRD=$(cd binary && ls live/initrd* 2>/dev/null | head -n1)
          echo "Kernel detectado: ${VMLINUZ} | Initrd detectado: ${INITRD}"
          {
            echo 'set default=0'
            echo 'set timeout=5'
            echo 'menuentry "Dzulux Linux 2.0 Server (Live CLI)" {'
            echo "    linux /${VMLINUZ:-live/vmlinuz} boot=live components username=dzulux hostname=dzulux quiet splash system_mode=cli"
            echo "    initrd /${INITRD:-live/initrd.img}"
            echo '}'
            echo 'menuentry "Dzulux Linux 2.0 Server (Modo Seguro / Gráficos Básicos)" {'
            echo "    linux /${VMLINUZ:-live/vmlinuz} boot=live components username=dzulux hostname=dzulux nomodeset system_mode=cli"
            echo "    initrd /${INITRD:-live/initrd.img}"
            echo '}'
          } | sudo tee binary/boot/grub/grub.cfg >/dev/null
          sudo mkdir -p binary/.disk
          echo "Dzulux Linux 2.0 Server (Beta) - amd64 LIVE" | sudo tee binary/.disk/info >/dev/null
          sudo rm -f *.iso
          sudo grub-mkrescue -o dzulux-server-hybrid.iso binary/ -- -volid "DZULUX_SERVER"
          ls -lh dzulux-server-hybrid.iso

      - name: Guardar ISO Generada y Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzulux-server-artifacts
          path: |
            dzulux-server-build/dzulux-server-hybrid.iso
            dzulux-server-build/build.log
          retention-days: 7

  build-desktop-iso:
    name: Compilar Dzulux Desktop (Modo GUI)
    runs-on: ubuntu-24.04

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso sudo mtools grub-pc-bin grub-efi-amd64-bin grub2-common
          sudo sed -i 's/live-config-upstart/live-config-systemd/g' /usr/lib/live/build/* /usr/share/live/build/functions/* 2>/dev/null || true
          sudo sed -i 's/LB_INITSYSTEM:-upstart/LB_INITSYSTEM:-systemd/g' /usr/share/live/build/functions/* 2>/dev/null || true

      - name: Inyectar Herramientas Dzulux, Temas XFCE y Wallpaper al Desktop
        run: |
          echo "Normalizando saltos de línea (LF) en scripts y hooks..."
          find dzulux-tools dzulux-desktop-build scripts -type f -exec sed -i 's/\r$//' {} +
          chmod +x scripts/*.sh || true
          bash scripts/generate-pdf.sh output/Guia_y_Agradecimientos_Dzulux.pdf || true
          mkdir -p dzulux-desktop-build/config/includes.chroot/usr/local/bin
          mkdir -p dzulux-desktop-build/config/includes.chroot/usr/share/backgrounds/dzulux
          mkdir -p dzulux-desktop-build/config/includes.chroot/usr/share/pixmaps
          mkdir -p dzulux-desktop-build/config/includes.chroot/etc/skel/.config
          mkdir -p dzulux-desktop-build/config/includes.chroot/etc/skel/Desktop
          mkdir -p dzulux-desktop-build/config/includes.chroot/etc/lightdm
          mkdir -p dzulux-desktop-build/config/includes.chroot/etc/modprobe.d
          cp dzulux-tools/* dzulux-desktop-build/config/includes.chroot/usr/local/bin/
          cp -f artwork/dzulux-wallpaper.svg dzulux-desktop-build/config/includes.chroot/usr/share/backgrounds/dzulux/dzulux-wallpaper.svg
          cp -f artwork/dzulux-logo.svg dzulux-desktop-build/config/includes.chroot/usr/share/pixmaps/dzulux-logo.svg
          cp -rf arch-legacy/airootfs/etc/skel/.config/xfce4 dzulux-desktop-build/config/includes.chroot/etc/skel/.config/
          cp -f arch-legacy/airootfs/etc/lightdm/lightdm-gtk-greeter.conf dzulux-desktop-build/config/includes.chroot/etc/lightdm/lightdm-gtk-greeter.conf
          cp -f arch-legacy/airootfs/etc/modprobe.d/apple-mac.conf dzulux-desktop-build/config/includes.chroot/etc/modprobe.d/apple-mac.conf
          cp -f output/Guia_y_Agradecimientos_Dzulux.pdf dzulux-desktop-build/config/includes.chroot/etc/skel/Desktop/Guia_y_Agradecimientos_Dzulux.pdf 2>/dev/null || true
          chmod +x dzulux-desktop-build/config/includes.chroot/usr/local/bin/*
          chmod +x dzulux-desktop-build/config/hooks/normal/*.chroot || true

      - name: Compilar Dzulux Desktop ISO (live-build)
        run: |
          set -o pipefail
          cd dzulux-desktop-build
          chmod +x auto/*
          sudo lb clean
          if ! sudo lb config 2>&1 | tee config.log; then
            echo "--- CONFIG FAILED. LOG OUTPUT: ---"
            cat config.log
            exit 1
          fi
          sudo lb build 2>&1 | tee build.log || true
          if [ -d binary/casper ]; then
            sudo mkdir -p binary/live
            sudo mv binary/casper/* binary/live/ 2>/dev/null || true
          fi
          if [ ! -f binary/live/filesystem.squashfs ]; then
            echo "--- BUILD FAILED (No se generó filesystem.squashfs). LAST 120 LINES OF LOG OUTPUT: ---"
            tail -n 120 build.log
            exit 1
          fi
          echo "Generando ISO híbrida con grub-mkrescue para máxima compatibilidad con Rufus y Máquinas Virtuales..."
          sudo mkdir -p binary/boot/grub
          VMLINUZ=$(cd binary && ls live/vmlinuz* 2>/dev/null | head -n1)
          INITRD=$(cd binary && ls live/initrd* 2>/dev/null | head -n1)
          echo "Kernel detectado: ${VMLINUZ} | Initrd detectado: ${INITRD}"
          {
            echo 'set default=0'
            echo 'set timeout=5'
            echo 'menuentry "Dzulux Linux 2.0 Desktop (Live XFCE GUI - Acelerado / VMware / VirtualBox / PC)" {'
            echo "    linux /${VMLINUZ:-live/vmlinuz} boot=live components username=dzulux hostname=dzulux quiet splash"
            echo "    initrd /${INITRD:-live/initrd.img}"
            echo '}'
            echo 'menuentry "Dzulux Linux 2.0 Desktop (Modo Seguro Gráficos - nomodeset)" {'
            echo "    linux /${VMLINUZ:-live/vmlinuz} boot=live components username=dzulux hostname=dzulux quiet splash nomodeset"
            echo "    initrd /${INITRD:-live/initrd.img}"
            echo '}'
            echo 'menuentry "Dzulux Linux 2.0 Desktop (Modo Terminal / CLI)" {'
            echo "    linux /${VMLINUZ:-live/vmlinuz} boot=live components username=dzulux hostname=dzulux quiet splash system_mode=cli"
            echo "    initrd /${INITRD:-live/initrd.img}"
            echo '}'
          } | sudo tee binary/boot/grub/grub.cfg >/dev/null
          sudo mkdir -p binary/.disk
          echo "Dzulux Linux 2.0 Desktop (Beta) - amd64 LIVE" | sudo tee binary/.disk/info >/dev/null
          sudo rm -f *.iso
          sudo grub-mkrescue -o dzulux-desktop-hybrid.iso binary/ -- -volid "DZULUX_DESKTOP"
          ls -lh dzulux-desktop-hybrid.iso

      - name: Guardar ISO Generada y Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzulux-desktop-artifacts
          path: |
            dzulux-desktop-build/dzulux-desktop-hybrid.iso
            dzulux-desktop-build/build.log
          retention-days: 7

  publish-release:
    name: Publicar ISOs en GitHub Releases
    needs: [build-server-iso, build-desktop-iso]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos (Server)
        uses: actions/download-artifact@v4
        with:
          name: dzulux-server-artifacts
          path: server-iso
      - name: Descargar artefactos (Desktop)
        uses: actions/download-artifact@v4
        with:
          name: dzulux-desktop-artifacts
          path: desktop-iso
      - name: Crear/Actualizar Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dzulux Linux (Auto-Build)"
          body: "Última compilación automática de Dzulux Linux Server y Desktop."
          files: |
            server-iso/*.iso
            desktop-iso/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
