          echo "2. Reemplazando /etc/hostname..."
          echo "3. Eliminando MOTD por defecto..."
          echo "4. Empaquetando ISO de Server..."
          # Próximamente: Comandos reales de debootstrap / live-build

  build-desktop-iso:
    name: Compilar Dzulux Desktop (Modo GUI)
    runs-on: ubuntu-latest

    steps:
