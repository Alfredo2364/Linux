<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDzul" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    <linearGradient id="gradNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glowDzul" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0a0e17" rx="16" />

  <!-- Logo Emblem: Monogram "D" with extended right leg (Dzulux V2) -->
  <g transform="translate(60, 32)">
    <!-- Base "D" shape with extended right leg -->
    <path d="M 30 140 L 30 20 L 90 20 C 145 20 165 55 165 80 C 165 105 145 140 90 140 L 30 140 L 190 140" 
          fill="none" 
          stroke="url(#gradDzul)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glowDzul)" />
    
    <!-- Stylized Cyan Tech Accent on the leg -->
    <path d="M 120 140 L 190 140" 
          fill="none" 
          stroke="url(#gradNeon)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Center Tech Core Dot inside the D -->
    <circle cx="75" cy="80" r="10" fill="#00f2fe" filter="url(#glowDzul)" />
  </g>

  <!-- Typography -->
  <text x="240" y="115" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="3">
    DZUL<tspan fill="url(#gradNeon)">UX</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="245" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#718096" letter-spacing="4">
    LINUX OS • DUAL MODE (GUI / CLI) • BETA
  </text>

  <!-- Signature Badge -->
  <g transform="translate(245, 168)">
    <rect width="290" height="26" rx="6" fill="#121927" stroke="#1f2d42" stroke-width="1.2"/>
    <text x="145" y="18" text-anchor="middle" font-family="'Segoe UI', Roboto, monospace" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="1">
      DISEÑADO POR ALFREDO DZUL
    </text>
  </g>
</svg>
