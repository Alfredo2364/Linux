# ==============================================================================
# Menú de Arranque GRUB - Dzulux Linux (Beta)
# Diseñado y Creado por Alfredo Dzul
# ==============================================================================

# Configuración visual de GRUB
set timeout=15
set default=0

# Colores de la interfaz GRUB
set color_normal=light-gray/black
set color_highlight=cyan/dark-gray

# Cargar soporte de video
insmod all_video
insmod font

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod gfxterm
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Entrada 1: Modo Gráfico por Defecto
menuentry "⚡ Dzulux Linux (Modo Gráfico / Desktop) [Beta] - Por Alfredo Dzul" --class dzulux --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G quiet splash
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

# Entrada 2: Modo Terminal / Consola Pura (Estilo Ubuntu Server)
menuentry "🖥️ Dzulux Linux (Modo Terminal / Servidor CLI) [Beta]" --class terminal --class gnu-linux --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% systemd.unit=multi-user.target system_mode=cli cow_spacesize=4G quiet
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

# Entrada 3: Modo Gráficos Seguros (Compatibilidad Mac / NVIDIA / Fallback)
menuentry "🛡️ Dzulux Linux (Modo Gráficos Seguros / Apple Mac & NVIDIA Safe)" --class recovery --class gnu-linux --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% nomodeset nouveau.modeset=0 radeon.modeset=0 cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

# Entrada 4: Detección y arranque de Windows / Sistema del disco local
if [ "${grub_platform}" == "efi" ]; then
    menuentry "🪟 Iniciar Windows Boot Manager (Instalado en el Disco)" --class windows --class os {
        insmod part_gpt
        insmod fat
        insmod chain
        search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
        chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    }
fi

# Separador
menuentry "---------------------------------------------------------" {
    true
}

# Utilidades del sistema
if [ "${grub_platform}" == "efi" ]; then
    menuentry "⚙️ Configuración del Firmware UEFI (BIOS)" {
        fwsetup
    }
fi

menuentry "🔄 Reiniciar Equipo" {
    reboot
}

menuentry "🛑 Apagar Equipo" {
    halt
}
