LABEL dzulux_gui
TEXT HELP
Iniciar Dzulux Linux en Modo Grafico (XFCE) [Beta]
Disenado por Alfredo Dzul
ENDTEXT
MENU LABEL Dzulux Linux (Modo Grafico / Desktop)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G quiet splash

LABEL dzulux_cli
TEXT HELP
Iniciar Dzulux Linux en Modo Terminal / Consola Servidor [Beta]
ENDTEXT
MENU LABEL Dzulux Linux (Modo Terminal / Servidor CLI)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
